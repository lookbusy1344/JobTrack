name: JobTrack Full Test Suite

# Runs the entire solution suite (everything `dotnet test JobTrack.slnx` reaches -- domain,
# application, architecture-fitness, identity, both persistence providers, database contract,
# public API, web integration, and real-browser end-to-end coverage) against a real local
# PostgreSQL instance, plus SQLite. Excludes JobTrack.Database.PerformanceTests, which sets
# IsTestProject=false precisely so a solution-wide run skips it -- see docs/developer-guide.md,
# "Performance lane". Takes several minutes, so it runs only on release tags rather than on every
# push (see .github/workflows/jobtrack.yml for the fast per-commit gate).
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # docs/developer-guide.md documents a local instance reachable at the Unix socket /tmp:5432;
  # the runner's PostgreSQL instead listens on its distro-default socket directory, so point the
  # fixtures (tests/JobTrack.TestSupport/PostgreSqlDatabaseFixture.cs) at that instead of
  # reconfiguring the server to match the docs' dev-machine path. Maximum Pool Size caps each test
  # process's own Npgsql pool (Npgsql's default is 100 per pool) -- every PostgreSQL-backed test
  # project runs against this one instance in parallel (docs/developer-guide.md's "shared
  # PostgreSQL instance contention"), and an uncapped pool from just one of them can exhaust the
  # server's own max_connections (raised below, but still finite) on its own.
  JOBTRACK_TEST_POSTGRES_ADMIN_CONNECTION_STRING: 'Host=/var/run/postgresql;Username=runner;Database=postgres;Maximum Pool Size=20'

jobs:
  full-test:
    name: Full solution test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Start PostgreSQL and grant the runner a superuser role
        run: |
          sudo systemctl start postgresql.service
          # Ubuntu's default max_connections (100) is easily exhausted once every PostgreSQL-backed
          # test project (ContractTests, Persistence.PostgreSql.Tests, the Postgres-backed browser
          # suite) runs concurrently against this one instance -- raise it before anything connects.
          sudo -u postgres psql -c "ALTER SYSTEM SET max_connections = 300;"
          sudo systemctl restart postgresql.service
          sudo -u postgres createuser --superuser "$(whoami)"
          pg_isready -h /var/run/postgresql

      - name: Restore client-side assets
        run: |
          dotnet tool install --global Microsoft.Web.LibraryManager.Cli
          cd src/JobTrack.Web && libman restore

      - name: Restore
        run: dotnet restore JobTrack.slnx

      - name: Build
        run: dotnet build JobTrack.slnx --no-restore

      - name: Install Playwright browsers
        run: pwsh tests/JobTrack.Web.EndToEndTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium firefox webkit

      - name: Full test suite
        # -m:1: dotnet test's default per-project parallelism assumes a dev machine's core count.
        # GitHub's standard runner has far fewer cores, and running every test project concurrently
        # starved xUnit's own internal scheduling (test host crashes: "Test host process crashed:
        # OperationCanceledException" from a timed-out SemaphoreSlim wait) and a Playwright browser
        # test (30s navigation timeout waiting on a CPU-starved child web host process). One project
        # at a time is slower but reliable; see docs/developer-guide.md's "shared PostgreSQL
        # instance contention" for the same lesson applied to the database side.
        run: dotnet test JobTrack.slnx --no-build -m:1

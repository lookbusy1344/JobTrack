name: JobTrack CI

# Build, verify formatting and run the fast core test suite on every push
# and pull request. Mirrors the local commit gate (see CLAUDE.md and
# scripts/fast-test.sh). Runs fast-test.sh's default informational budget
# mode, not --strict: GitHub-hosted runners are slower and noisier than a
# dev machine, so the 20s/80s budgets aren't a meaningful CI gate here --
# only a real test failure should fail the build.
on:
  push:
    tags-ignore:
      - '*'
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-test:
    name: Build, format & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore JobTrack.slnx

      - name: Build
        run: dotnet build JobTrack.slnx --no-restore

      # - name: Verify formatting
      #   run: dotnet format JobTrack.slnx --verify-no-changes

      - name: Fast core tests
        run: scripts/fast-test.sh

# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # Npgsql.EntityFrameworkCore.PostgreSQL 10.x requires EF Core < 11, and its 11.0 line is
    # still prerelease. Remove these once a stable Npgsql EF Core 11 provider ships.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: [">= 11.0.0"]
      - dependency-name: "Microsoft.AspNetCore.DataProtection.EntityFrameworkCore"
        versions: [">= 11.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

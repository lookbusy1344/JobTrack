# ADR 0066 Stage 7: deterministic round-robin HTTPS entry point for the local multi-instance compose
# topology (docker/compose.multi-instance.yml). No sticky/session-affinity directive anywhere here --
# nginx's default upstream balancing is round robin, which is exactly the "no session affinity
# required" shape the multi-instance plan requires (plan §1).
worker_processes 1;

events {
	worker_connections 128;
}

http {
	upstream jobtrack_backends {
		server web-a:8080 max_fails=1 fail_timeout=5s;
		server web-b:8080 max_fails=1 fail_timeout=5s;
	}

	server {
		listen 8443 ssl;
		server_name localhost;

		ssl_certificate /etc/nginx/tls/proxy-tls.crt;
		ssl_certificate_key /etc/nginx/tls/proxy-tls.key;

		location / {
			proxy_pass http://jobtrack_backends;
			# The original client-facing Host, not the upstream's -- Program.cs's AllowedHosts check
			# (web-host-security.md) validates against this value, and both web-a/web-b are configured
			# with the same allowlist entry the proxy's own clients use.
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $remote_addr;
			# Internal proxy-to-backend traffic stays plain HTTP (compose.multi-instance.yml's own
			# comment) -- this header is what tells Program.cs's ForwardedHeadersMiddleware the
			# original request really was HTTPS, so UseHttpsRedirection() does not loop a request that
			# already arrived securely.
			proxy_set_header X-Forwarded-Proto https;
		}
	}
}
